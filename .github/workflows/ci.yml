# Unit tests use stand-ins and a practice mock home folder, so they need no keys or network.
# The real-editor test needs a display, so it runs here under xvfb (not in `npm test`).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays: catch breakage from new dependency or editor versions
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: node scripts/check-vsix.mjs

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:integration
