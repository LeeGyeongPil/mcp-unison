# Unit tests use stand-ins and a practice mock home folder, so they need no keys or network.
# The real-editor test needs a display, so it runs here under xvfb (not in `npm test`).
# Each job prints its environment first, and the real-editor test prints the editor's own
# log files when it fails, so a red run can be explained from the job log alone.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays: catch breakage from new dependency or editor versions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Pinned: the ubuntu-latest label moves to Ubuntu 26.04 during November 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Show environment
        run: |
          node --version
          npm --version
          grep PRETTY_NAME /etc/os-release
          echo "LANG=${LANG:-unset}"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package
      - run: node scripts/check-vsix.mjs

  integration:
    # Runs beside the unit tests instead of after them, so each job reports its own result.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Show environment and display tools
        run: |
          node --version
          npm --version
          grep PRETTY_NAME /etc/os-release
          # xvfb-run needs xauth as well; install them only when the image lacks either.
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends xvfb xauth
          fi
          command -v xvfb-run xauth Xvfb
      - run: npm ci --no-audit --no-fund
      - name: Real VS Code test under a virtual display
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:integration
        timeout-minutes: 12
